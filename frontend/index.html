<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    >
    <title>Speedtest &#8902; SpeedyBench</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon.svg"
    >
  </head>
  <body>
    <header class="top-header">
      <a
        class="logo-area"
        href="https://github.com/underhax/speedybench"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span
          class="icon"
          id="logo-icon"
        ></span>
        <span class="logo-text">SpeedyBench</span>
      </a>
      <div class="top-controls">
        <div
          class="lang-selector custom-dropdown"
          id="lang-dropdown"
        >
          <div
            class="dropdown-selected"
            id="lang-selected"
          >
            <span
              class="icon"
              id="lang-icon"
            ></span>
            <span id="current-lang-text">EN</span>
          </div>
          <ul
            class="dropdown-options"
            id="lang-options"
          ></ul>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="icon-btn"
        ></button>
        <button
          type="button"
          id="settings-toggle"
          class="icon-btn"
        ></button>
      </div>
    </header>

    <div
      id="settings-modal"
      class="modal-overlay hidden"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 data-i18n="settings_title">Settings</h2>
          <button
            type="button"
            class="close-btn"
            id="modal-close"
          >
            &times;
          </button>
        </div>
        <div class="modal-body">
          <div class="setting-group">
            <label for="size-slider">
              <span data-i18n="settings_size">Test Volume</span>
              <span class="range-value"><span id="size-val">200</span> MB</span>
            </label>
            <input
              type="range"
              id="size-slider"
              min="100"
              max="1000"
              step="100"
              value="200"
            >
          </div>
          <div class="setting-group">
            <label for="time-slider">
              <span data-i18n="settings_time">Time Limit</span>
              <span class="range-value"
                ><span id="time-val">15</span> <span data-i18n="settings_sec">s</span></span
              >
            </label>
            <input
              type="range"
              id="time-slider"
              min="10"
              max="30"
              step="5"
              value="15"
            >
          </div>
          <p
            class="settings-hint"
            data-i18n="settings_hint"
          >
            The test completes when either limit is reached first.
          </p>
          <div class="setting-group radio-group">
            <div
              class="setting-label"
              data-i18n="settings_calc_method"
            >
              Calculation Method
            </div>
            <div class="radio-options">
              <label class="radio-option">
                <input
                  type="radio"
                  name="calcMethod"
                  value="peak"
                >
                <div class="radio-content">
                  <span
                    class="radio-title"
                    data-i18n="settings_calc_peak_title"
                    >Peak Sustained</span
                  >
                  <span
                    class="radio-desc"
                    data-i18n="settings_calc_peak_desc"
                    >Smart smoothing that drops the initial warmup phase and anomalies to show pure
                    channel capacity.</span
                  >
                </div>
              </label>
              <label class="radio-option">
                <input
                  type="radio"
                  name="calcMethod"
                  value="cumulative"
                >
                <div class="radio-content">
                  <span
                    class="radio-title"
                    data-i18n="settings_calc_cum_title"
                    >Cumulative Average</span
                  >
                  <span
                    class="radio-desc"
                    data-i18n="settings_calc_cum_desc"
                    >Strict mathematical average over the entire test duration. Accurate for true
                    data transfer speeds.</span
                  >
                </div>
              </label>
            </div>
          </div>
          <div class="setting-group-toggle">
            <div
              class="setting-label"
              data-i18n="settings_threads"
            >
              Connections
            </div>
            <div class="toggle-container">
              <span
                class="toggle-label"
                id="label-multi"
                data-i18n="settings_multi"
                >Multi</span
              >
              <button
                type="button"
                id="threads-toggle"
                class="circle-toggle"
                aria-pressed="false"
              >
                <span
                  class="icon"
                  id="threads-icon"
                ></span>
              </button>
              <span
                class="toggle-label"
                id="label-single"
                data-i18n="settings_single"
                >Single</span
              >
            </div>
          </div>
          <div class="setting-group checkbox-group">
            <label>
              <input
                type="checkbox"
                id="save-settings-chk"
              >
              <span data-i18n="settings_save">Save in browser (localStorage)</span>
            </label>
          </div>
          <div class="modal-actions">
            <button
              type="button"
              id="settings-reset-btn"
              class="btn-secondary"
              data-i18n="settings_reset"
            >
              Reset
            </button>
            <button
              type="button"
              id="settings-apply-btn"
              class="btn-primary"
              data-i18n="settings_apply"
            >
              Apply
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="test">
      <div class="testGroup">
        <div class="ping_jitter_area">
          <fieldset
            class="stat-item"
            id="stat-ping"
            data-i18n-aria="idle_ping"
            aria-label="Idle Latency"
          >
            <span
              class="icon"
              id="ping-icon"
            ></span>
            <span
              id="pingText"
              class="meterText"
            ></span>
            <span
              class="unit"
              data-i18n="unit_ms"
              >ms</span
            >
          </fieldset>
          <fieldset
            class="stat-item"
            id="stat-dl-ping"
            data-i18n-aria="dl_ping"
            aria-label="Download Latency"
          >
            <span
              class="icon"
              id="dl-ping-icon"
            ></span>
            <span
              id="dlPingText"
              class="meterText"
            ></span>
            <span
              class="unit"
              data-i18n="unit_ms"
              >ms</span
            >
          </fieldset>
          <fieldset
            class="stat-item"
            id="stat-ul-ping"
            data-i18n-aria="ul_ping"
            aria-label="Upload Latency"
          >
            <span
              class="icon"
              id="ul-ping-icon"
            ></span>
            <span
              id="ulPingText"
              class="meterText"
            ></span>
            <span
              class="unit"
              data-i18n="unit_ms"
              >ms</span
            >
          </fieldset>
          <fieldset
            class="stat-item"
            id="stat-jitter"
            data-i18n-aria="jitter"
            aria-label="Jitter"
          >
            <span
              class="icon"
              id="jitter-icon"
            ></span>
            <span
              id="jitText"
              class="meterText"
            ></span>
            <span
              class="unit"
              data-i18n="unit_ms"
              >ms</span
            >
          </fieldset>
        </div>

        <div class="testArea">
          <svg
            id="dlChart"
            class="chart-bg"
            viewBox="0 0 1000 100"
            preserveAspectRatio="none"
            aria-hidden="true"
          ></svg>
          <div class="testName">
            <span
              class="icon"
              id="download-icon"
            ></span>
            <span
              class="title"
              data-i18n="download"
              >Download</span
            >
            <span
              class="unit"
              data-i18n="unit_mbps"
              >Mbps</span
            >
          </div>
          <div
            id="dlText"
            class="meterText"
          ></div>
          <div class="subTextWrapper">
            <div
              id="dlSubText"
              class="meterSubText"
            ></div>
            <button
              id="dl-info-btn"
              class="info-btn hidden"
              type="button"
              data-i18n-aria="test_details"
              aria-label="Test Details"
              data-i18n-title="test_details"
              title="Test Details"
            >
              <span
                class="icon"
                id="dl-info-icon"
              ></span>
            </button>
          </div>
        </div>

        <div class="testArea">
          <svg
            id="ulChart"
            class="chart-bg"
            viewBox="0 0 1000 100"
            preserveAspectRatio="none"
            aria-hidden="true"
          ></svg>
          <div class="testName">
            <span
              class="icon"
              id="upload-icon"
            ></span>
            <span
              class="title"
              data-i18n="upload"
              >Upload</span
            >
            <span
              class="unit"
              data-i18n="unit_mbps"
              >Mbps</span
            >
          </div>
          <div
            id="ulText"
            class="meterText"
          ></div>
          <div class="subTextWrapper">
            <div
              id="ulSubText"
              class="meterSubText"
            ></div>
            <button
              id="ul-info-btn"
              class="info-btn hidden"
              type="button"
              data-i18n-aria="test_details"
              aria-label="Test Details"
              data-i18n-title="test_details"
              title="Test Details"
            >
              <span
                class="icon"
                id="ul-info-icon"
              ></span>
            </button>
          </div>
        </div>

        <div
          class="ipArea"
          id="ipArea"
        >
          <span
            class="icon"
            id="ip-icon"
          ></span>
          <span id="ip"></span>
        </div>

        <div id="startStopBtn"><span class="btn-text"></span></div>
      </div>
    </div>
    <div
      id="details-modal"
      class="modal-overlay hidden"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="details-title">Details</h2>
          <div class="modal-header-actions">
            <button
              type="button"
              class="icon-btn-ghost"
              id="details-copy-btn"
              data-i18n-aria="copy_tsv"
              aria-label="Copy"
              data-i18n-title="copy_tsv"
              title="Copy"
            >
              <span
                class="icon"
                id="details-copy-icon"
              ></span>
            </button>
            <button
              type="button"
              class="close-btn"
              id="details-close"
            >
              &times;
            </button>
          </div>
        </div>
        <div class="modal-body details-body">
          <div class="details-table-wrapper">
            <table class="details-table">
              <tbody id="details-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script
      type="module"
      src="./src/main.ts"
    ></script>
  </body>
</html>
