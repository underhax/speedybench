services:
  speedybench:
    image: ghcr.io/underhax/speedybench:latest
    container_name: speedybench
    hostname: speedybench
    restart: always
    ports:
      - "127.0.0.1:8989:8989"
    healthcheck:
      test: ["CMD", "/app/speedybench", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    user: "65534:65534"
    cpus: 1.0
    mem_limit: 128m
    mem_reservation: 32m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
