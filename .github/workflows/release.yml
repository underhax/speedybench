name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Build and Archive
        run: |
          mkdir -p release_assets
          
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run build
          
          GOOS=${{ matrix.target.goos }}
          GOARCH=${{ matrix.target.goarch }}
          BUILD_DIR="build_${GOOS}_${GOARCH}"
          mkdir -p "$BUILD_DIR"
          
          cp LICENSE "$BUILD_DIR/"
          cp README.md "$BUILD_DIR/"
          
          OUTPUT_NAME="speedybench"
          if [ "$GOOS" = "windows" ]; then
            OUTPUT_NAME="speedybench.exe"
          fi
          
          echo "Building $OUTPUT_NAME for $GOOS/$GOARCH..."
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}'" -o "${BUILD_DIR}/${OUTPUT_NAME}" ./cmd/speedybench
          
          cd "$BUILD_DIR"
          if [ "$GOOS" = "windows" ]; then
            zip -r "../release_assets/speedybench-${GOOS}-${GOARCH}.zip" ./*
          else
            tar -czvf "../release_assets/speedybench-${GOOS}-${GOARCH}.tar.gz" ./*
          fi
          cd ..

      - name: Publish Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release_assets/*
